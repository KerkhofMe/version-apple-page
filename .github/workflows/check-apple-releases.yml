name: Check Apple releases

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: apple-release-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check official Apple release sources
        run: python scripts/check_releases.py

      - name: Test release parsers
        run: python -m unittest discover -s tests

      - name: Open or update release pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/releases.js; then
            echo "No new Apple releases found."
            exit 0
          fi

          branch="automation/apple-release-update"
          remote_sha=$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)
          if [ -n "$remote_sha" ]; then
            git fetch origin "$branch:refs/remotes/origin/$branch"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add data/releases.js
          git commit -m "Update Apple software releases"
          if [ -n "$remote_sha" ]; then
            git push --force-with-lease="refs/heads/$branch:$remote_sha" --set-upstream origin "$branch"
          else
            git push --force-with-lease="refs/heads/$branch:" --set-upstream origin "$branch"
          fi

          if ! gh pr list --head "$branch" --state open --json number --jq '.[0].number' | grep -q '[0-9]'; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title "Update Apple software releases" \
              --body "Updates stable and beta release data from official Apple sources. Generated by the daily Apple release checker."
          fi
